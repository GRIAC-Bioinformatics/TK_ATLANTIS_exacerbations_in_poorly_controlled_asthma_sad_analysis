# Configuration file for SAD-exacerbation analysis
# Copy this file to config.yaml and fill in your local paths.
# config.yaml is listed in .gitignore and will NOT be committed.

paths:
  # --- Input data ---
  patient_data:       ""   # e.g. "/home/user/data/atlantis_patient_data.csv"
  exacerbations_data: ""   # e.g. "/home/user/data/atlantis_exacerbations.Rdata"

  # --- Intermediate files (generated by TK_severe_SAD_definition.R) ---
  severe_sad_table:   ""   # e.g. "/home/user/data/severe_SAD_table.csv"

  # --- Output directories ---
  output_tables:      ""   # e.g. "/home/user/output/tables"
  output_figures:     ""   # e.g. "/home/user/output/figures"
  output_severe_sad:  ""   # e.g. "/home/user/output/severe_sad"
